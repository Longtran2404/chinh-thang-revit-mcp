[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win10-computer-bridge-mcp"
version = "0.3.0"
description = "Local, consent-gated Win10 screenshot and full mouse MCP bridge for Codex"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "Pillow>=10.4,<13"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["win10_bridge_mcp*"]
