# Modified for Chinh Thang Revit MCP, 2026-09-18. See FORK_CHANGES.md.
name: Build Chinh Thang Revit MCP
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test, build and package Revit 2024
        shell: pwsh
        run: ./scripts/build-local.ps1
      - name: Verify MCP stdio handshake
        run: python scripts/smoke-test.py artifacts/ChinhThangRevitMcp-1.2.0-win-x64/server/RvtMcp.Server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ChinhThangRevitMcp-1.2.0-win-x64
          path: artifacts/ChinhThangRevitMcp-1.2.0-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
